# Kafka 本地开发环境（KRaft 模式，不依赖 ZooKeeper）
#
# 常用命令：
#   docker compose up -d          启动（首次会自动拉取镜像）
#   docker compose ps             查看状态
#   docker compose logs -f kafka  查看日志
#   docker compose down           停止并删除容器（保留数据卷）
#   docker compose down -v        停止并删除容器 + 数据卷
#
# 端口 9094 与 config/config.yaml 中 kafka.brokers 保持一致，
# 单节点场景请把 config.yaml 的 brokers 精简为只留 localhost:9094。

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    # 该镜像默认以非 root 的 appuser(1000) 运行，而它内部并没有 /opt/kafka/data 目录，
    # 于是 Docker 首次挂载 named volume 时会创建一个 root:root 的目录 → appuser 无法写入，
    # 启动即报 AccessDeniedException: /opt/kafka/data/bootstrap.checkpoint.tmp 并退出。
    # 本地开发直接用 root 运行最省事（生产请改用正确的目录属主 / 独立数据盘）。
    user: "0:0"
    ports:
      - "9094:9094" # 宿主机 → 容器：Go 应用通过 localhost:9094 连接
    environment:
      # ---- KRaft 角色与节点 ----
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # ---- 三个监听器：INTERNAL 供 broker 互通 / CONTROLLER 供仲裁 / EXTERNAL 供宿主机 ----
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # ---- 单节点：内部 topic 的副本因子必须是 1 ----
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # ---- 只启用 classic / consumer 两种重平衡协议 ----
      # Kafka 3.9 默认还带 share 协议（KIP-932 预览），share coordinator 会在 log.dirs 下
      # 创建 `shared` 目录，而 LogManager 扫描 log.dirs 时又把它当成非法目录名，
      # 导致启动即报 "Found directory /opt/kafka/data/shared, 'shared' is not in the form of
      # topic-partition"。本地学习用不到 share groups，关掉即可。
      KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS: "classic,consumer"
      # ---- 自动创建 topic 时的默认分区数 ----
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # ---- 数据目录：挂到 named volume，重启不丢消息 ----
      KAFKA_LOG_DIRS: /opt/kafka/data
      # ---- 本地开发限制堆内存（默认偏大） ----
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - kafka-data:/opt/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9094 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

volumes:
  kafka-data:
